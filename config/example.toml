[project]
input_dir = "incoming"
output_dir = "translated"
state_dir = "state"
log_dir = "logs"
glossary_dir = "glossary"
context_dir = "context"

[translation]
lang_in = "en"
lang_out = "zh"
translator = "codex-sdk"
model = ""
effort = "low"
qps = 1
min_text_length = 5
no_mono = false
no_dual = false
watermark_output_mode = "no_watermark"
auto_extract_glossary = false
max_retries = 3
# Operator-visible retry policy keyed by error category. Values are the
# maximum total attempts for that category; 1 disables automatic retries.
# Categories not listed and unknown categories use `max_retries` as the
# ceiling. A category policy can only lower the global `max_retries` value.
retry_policy = { auth = 1, config = 1, input = 1, validation = 1, output = 1 }
cache_enabled = true
cache_store_plaintext = true
# Optional expiration in seconds. Omit this line to keep entries indefinitely.

[babeldoc]
backend = "python-internal"
working_dir = "state/babeldoc-work"
translate_table_text = false
ocr_workaround = false
auto_enable_ocr_workaround = true
enhance_compatibility = true
# Keep terminal job working directories (including failed-job diagnostics)
# for this many days before `babelcodex cleanup` removes them. 0 removes
# terminal directories immediately.
work_retention_days = 7

[codex]
# Reuses the existing Codex / ChatGPT login state.
# Run `codex` or use the SDK login flow once before translation.
thread_mode = "per-document"
sandbox = "read_only"
strict_output = true
context_prompt = "Translate faithfully and preserve terminology. Do not explain the translation."
context_max_chars = 4000
# 0 disables automatic compact. Positive values compact before the next turn.
max_turns_before_compact = 0
