[package]
name = "babelcodex-gui"
version = "0.1.0"
description = "BabelCodex local PDF translation desktop host"
authors = ["15699122"]
edition = "2021"

[lib]
name = "babelcodex_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-dialog = "2.3"
tauri-plugin-shell = "2.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
