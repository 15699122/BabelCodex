[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "babelcodex"
version = "0.1.0"
description = "Personal local-first high-fidelity PDF translation with BabelDOC and Codex"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "15699122"}]
dependencies = []

[project.optional-dependencies]
runtime = [
  "BabelDOC>=0.6.4,<0.7",
  "openai-codex",
]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
babelcodex = "codex_babeldoc.cli:main"
cbpdf = "codex_babeldoc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_babeldoc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv]
required-version = "==0.12.10"
